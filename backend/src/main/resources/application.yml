spring:
  application:
    name: bill-box
  datasource:
    url: jdbc:postgresql://localhost:5432/billbox
    username: billbox
    password: billbox
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mail:
    host: ${BILLBOX_SMTP_HOST:localhost}
    port: ${BILLBOX_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

billbox:
  jwt:
    secret: ${BILLBOX_JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-long!!}
    expiration-ms: 86400000
  storage:
    root: ${BILLBOX_STORAGE:${user.home}/.billbox/storage}
  cors:
    allowed-origins: http://localhost:5173
  public-url: ${BILLBOX_PUBLIC_URL:http://localhost:5173}
  mail:
    from: ${BILLBOX_MAIL_FROM:Bill Box <noreply@billbox.local>}
